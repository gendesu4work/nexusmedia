<title>Product Calculator – NEXUSMEDIA</title>
<style>
:root{--bg:#eef7fd;--card:#fff;--tx:#0f2a3d;--mut:#5a778a;--ac:#0a84c6;--on:#fff;--hd1:#0a84c6;--hd2:#4fb8f0;--ln:#d3e6f2;--ok:#1b8a4e;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1620;--card:#12232f;--tx:#e8f3fa;--mut:#8fb0c4;--ac:#4fb8f0;--on:#06202f;--hd1:#0d4a6e;--hd2:#1b7fb3;--ln:#223646;--ok:#5fd08f;--bad:#f08a7c}}
:root[data-theme="dark"]{--bg:#0b1620;--card:#12232f;--tx:#e8f3fa;--mut:#8fb0c4;--ac:#4fb8f0;--on:#06202f;--hd1:#0d4a6e;--hd2:#1b7fb3;--ln:#223646;--ok:#5fd08f;--bad:#f08a7c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:760px;margin:0 auto;padding:12px 14px 80px}
h1{font-size:20px;margin:6px 0 10px}h2{font-size:16px;margin:0 0 8px}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
nav button{flex:1;white-space:nowrap;border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:9px 10px;border-radius:10px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.k{font-size:12px;color:var(--mut)}.v{font-size:20px;font-weight:700}
.pos{color:var(--ok)}.neg{color:var(--bad)}
input,select{width:100%;padding:9px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;gap:8px;margin-bottom:8px}.row>*{flex:1;min-width:0}
.btn{background:var(--ac);color:var(--on);border:0;padding:10px 14px;border-radius:8px;font:inherit;cursor:pointer;width:100%}
.x{background:none;border:0;color:var(--bad);cursor:pointer;font-size:18px;flex:0 0 auto;width:auto}
.ov{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--ln);white-space:nowrap}th:first-child,td:first-child{text-align:left}
.li{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--ln);font-size:14px}
.note{font-size:12px;color:var(--mut)}label.t{display:flex;gap:8px;align-items:center;margin-bottom:8px}label.t input{width:auto}
.sync{font-size:12px;color:var(--mut);margin-top:6px}
h1{color:var(--ac);margin:0}header{display:flex;justify-content:space-between;align-items:center;margin:6px 0 12px}
#th{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 10px;font-size:18px;cursor:pointer}
footer{text-align:center;color:var(--mut);font-size:12px;margin-top:24px;padding-top:12px;border-top:1px solid var(--ln)}
@media(min-width:900px){main{max-width:1000px}.grid{grid-template-columns:repeat(4,1fr)}h1{font-size:24px}}
.logo{width:40px;height:40px;object-fit:contain;flex:0 0 auto}h1{display:flex;align-items:center;gap:10px}@media(min-width:900px){.logo{width:48px;height:48px}}
header{background:linear-gradient(135deg,var(--hd1),var(--hd2));color:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 6px 18px rgba(10,132,198,.22)}
#brand{display:flex;align-items:center;gap:12px;min-width:0}
.bl{width:48px;height:48px;border-radius:12px;background:#fff;object-fit:contain;padding:4px;flex:0 0 auto}
.bn{font-size:20px;font-weight:700;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bs{font-size:12px;opacity:.9}
#th{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4);color:#fff}
.card{box-shadow:0 1px 3px rgba(15,42,61,.07)}.v{font-size:22px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
nav button{border-radius:999px}
.av{width:44px;height:44px;border-radius:50%;background:var(--ln);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--ac);overflow:hidden;cursor:pointer;flex:0 0 auto;font-size:13px}.av img{width:100%;height:100%;object-fit:cover}
footer img{width:18px;height:18px;vertical-align:-4px;margin-right:4px}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>

function ytd(ym){const y=ym.slice(0,4),mm=+ym.slice(5,7);let rev=0,net=0;for(let k=1;k<=mm;k++){const c=calcFor(y+'-'+String(k).padStart(2,'0'));rev+=c.rev;net+=c.net}return{rev,net}}
function taxOf(y){const k=S.set.tax||'none';if(k==='8')return Math.max(0,y.rev-(S.set.allow===false?0:250000))*.08;if(k==='grad')return grad(Math.max(0,y.net))+.03*y.rev;if(k==='osd')return grad(y.rev*.6)+.03*y.rev;return 0}
function taxCard(c){if((S.set.tax||'none')==='none')return '';const y=month.slice(0,4),mm=+month.slice(5,7),a=ytd(month),pm=mm>1?ytd(y+'-'+String(mm-1).padStart(2,'0')):{rev:0,net:0};const ty=taxOf(a),tm=Math.max(0,ty-taxOf(pm));
 return `<div class="card"><h2>Estimated tax</h2><div class="li"><span>This month</span><b>${m(tm)}</b></div><div class="li"><span>Year to date (${y})</span><b>${m(ty)}</b></div><div class="li"><b>Net profit after tax (this month)</b><b class="${cls(c.net-tm)}">${m(c.net-tm)}</b></div><div class="note">Rough estimate only, not a tax return. Check with the BIR or an accountant.</div></div>`}
function taxSet(){const k=S.set.tax||'none';return `<div class="card"><h2>Tax estimate (Philippines)</h2><select onchange="S.set.tax=this.value;save();render()">${[['none','No tax estimate'],['8','8% flat on gross sales'],['grad','Graduated rates, itemized (uses net profit) + 3% percentage tax'],['osd','Graduated rates, 40% standard deduction + 3% percentage tax']].map(o=>`<option value="${o[0]}" ${k===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>${k==='8'?`<label class="t" style="margin-top:8px"><input type="checkbox" ${S.set.allow===false?'':'checked'} onchange="S.set.allow=this.checked;save();render()"> Business is my only income (₱250,000 of yearly sales is not taxed)</label>`:''}<div class="note" style="margin-top:6px">Estimates only. Rates and rules can change, so confirm with the BIR or an accountant. The 8% option replaces the percentage tax. VAT (at ₱3,000,000 sales) is not included.</div></div>`}
function lk(i){const n=(i.name||'').toLowerCase(),u=i.u||'g';return S.inv.find(v=>v.name.toLowerCase()===n&&v.u===u)}
function ic(i){const v=lk(i),k=v?v.pack:i.pack,c=v?v.pc:i.pc;return k>0?i.g/k*c:0}
function msg(t){const u=$('#undo');u.textContent=t;clearTimeout(undoT);undoT=setTimeout(()=>{u.textContent=''},6000)}
function addInv(){const n=$('#vn').value.trim(),u=$('#vu').value;if(!n)return;if(S.inv.some(v=>v.name.toLowerCase()===n.toLowerCase()&&v.u===u)){msg('That ingredient is already in your inventory.');return}
 S.inv.push({id:uid(),name:n,u,qty:+$('#vq').value||0,low:+$('#vl').value||0,pack:+$('#vk').value||0,pc:+$('#vc').value||0});save();render()}
function invEdit(id,f,v){const x=S.inv.find(a=>a.id===id);if(!x)return;
 if(f==='name'||f==='u'){const links=[];S.products.forEach(p=>(p.ing||[]).forEach(i=>{if(lk(i)===x)links.push(i)}));x[f]=v.trim()||x[f];links.forEach(i=>{i[f]=x[f]})}else x[f]=+v||0;
 save();render()}
function invAdd(id){const x=S.inv.find(a=>a.id===id),a=+$('#ia').value;if(!x||!(a>0))return;x.qty=+(x.qty+a).toFixed(3);save();render()}
function useOf(p,q){const n=p.batch||12,o={};(p.ing||[]).forEach(i=>{const v=lk(i);if(v)o[v.id]=(o[v.id]||0)+q*i.g/n});return o}
function lowCard(){const L=S.inv.filter(v=>v.qty<=0||(v.low>0&&v.qty<=v.low));if(!L.length)return '';return `<div class="card" style="border-color:var(--bad)"><h2>⚠️ Low stock</h2>${L.map(v=>`<div class="li"><span>${esc(v.name)}</span><b class="neg">${+(+v.qty).toFixed(1)} ${v.u} left</b></div>`).join('')}</div>`}
function renderBrand(){const b=S.brand||{};$('#brand').innerHTML=`<img class="bl" alt="" src="${b.logo||APPLOGO}"><div style="min-width:0"><div class="bn">${esc(b.name||'Product Calculator')}</div><div class="bs">${b.name?'Powered by Product Calculator':'Cost, stock & profit tracker'}</div></div>`}
function brandCard(){const b=S.brand||{};return `<div class="card"><h2>Business profile</h2><input value="${esc(b.name||'')}" placeholder="Your business name (optional)" onchange="bSet('name',this.value)"><div class="row" style="margin-top:8px;align-items:center"><label class="av" style="border-radius:12px;width:64px;height:64px;flex:0 0 64px">${b.logo?`<img src="${b.logo}" alt="">`:'Logo'}<input type="file" accept="image/*" hidden onchange="bLogo(this)"></label><div class="note">Tap the box to add your logo (optional). It shows at the top of the app.${b.logo?` <a href="#" onclick="bSet('logo','');return false" style="color:var(--ac)">Remove logo</a>`:''}</div></div></div>`}
function bSet(k,v){S.brand=S.brand||{};S.brand[k]=v;save();render()}
function shrink(file,sz,sq,cb){const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{let sx=0,sy=0,sw=im.width,sh=im.height,cw,ch;
 if(sq){const m=Math.min(sw,sh);sx=(sw-m)/2;sy=(sh-m)/2;sw=sh=m;cw=ch=sz}else{const k=Math.min(1,sz/Math.max(sw,sh));cw=Math.round(sw*k);ch=Math.round(sh*k)}
 const c=document.createElement('canvas');c.width=cw;c.height=ch;c.getContext('2d').drawImage(im,sx,sy,sw,sh,0,0,cw,ch);cb(c.toDataURL(sq?'image/jpeg':'image/webp',0.85))};im.onerror=()=>msg('That file could not be read as a picture.');im.src=rd.result};rd.readAsDataURL(file)}
function bLogo(i){const f=i.files[0];if(f)shrink(f,160,false,d=>{if(d.length>150000){msg('That image is too detailed. Try a simpler or smaller logo.');return}bSet('logo',d)})}
function stPhoto(id,i){const f=i.files[0];if(f)shrink(f,96,true,d=>stEdit(id,'ph',d))}
setInterval(trySync,20000);addEventListener('online',()=>{trySync();status()});addEventListener('offline',()=>status());
start();
</script></body></html>
