name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies (robust)
        run: |
          set -e
          # retry npm ci a few times to avoid transient network errors
          retry=0
          until [ $retry -ge 3 ]
          do
            npm ci && break
            retry=$((retry+1))
            echo "npm ci failed, retrying ($retry/3)..."
            sleep 5
          done
          # if still failing, fall back to install without optional native deps
          if [ $retry -ge 3 ]; then
            rm -rf node_modules package-lock.json
            npm install --no-optional
          fi

      - name: Build
        env:
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}
        run: npm run build

      - name: Create 404 fallback for SPA routing
        run: |
          # Ensure client-side routes work on refresh by serving index for 404s
          if [ -f dist/index.html ]; then
            cp dist/index.html dist/404.html
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          cname: nexusmediaph.com
